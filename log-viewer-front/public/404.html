<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
        var basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var rest = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
        var search = l.search ? l.search.replace(/&/g, '~and~') : '';
        l.replace(origin + basePath + '/?/' + rest + search + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
